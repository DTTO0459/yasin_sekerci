<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Bilgileri | Yasin şekerci</title>
    <!-- Modern tasarım için TailwindCSS kullanıyoruz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        function kopyala() {
            // Buradaki IBAN numarasını kendinize göre güncelleyin
            const iban = "TR72 0015 7000 0000 0157 0274 66"; 
            navigator.clipboard.writeText(iban).then(() => {
                const btn = document.getElementById("copyBtn");
                btn.innerHTML = '<i class="fas fa-check"></i> Kopyalandı';
                btn.classList.replace("bg-blue-600", "bg-green-500");
                btn.classList.replace("hover:bg-blue-700", "hover:bg-green-600");
                
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-copy"></i> IBAN Kopyala';
                    btn.classList.replace("bg-green-500", "bg-blue-600");
                    btn.classList.replace("hover:bg-green-600", "hover:bg-blue-700");
                }, 2000);
            });
        }
    </script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center">
        <!-- İkon alanı (İsterseniz logonuzu koyabilirsiniz) -->
        <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-wallet text-3xl text-blue-600"></i>
        </div>
        
        <h2 class="text-2xl font-bold text-gray-800 mb-1">Yasin Şekerci</h2>
        <p class="text-gray-500 text-sm mb-6">Banka Ödeme Bilgileri</p>
        
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-6 text-left shadow-inner">
            <p class="text-xs text-gray-400 uppercase font-semibold mb-1">Banka Adı</p>
            <p class="text-sm font-medium text-gray-700 mb-4"> BANKA </p>
            
            <p class="text-xs text-gray-400 uppercase font-semibold mb-1">IBAN</p>
            <p class="text-sm font-mono font-bold text-slate-800 break-all">TR72 0015 7000 0000 0157 0274 66</p>
        </div>
        
        <button id="copyBtn" onclick="kopyala()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-300 flex items-center justify-center gap-2 shadow-lg shadow-blue-200">
            <i class="fas fa-copy"></i> IBAN Kopyala
        </button>
    </div>
</body>
</html>
