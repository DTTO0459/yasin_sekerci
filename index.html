<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Semanur'un Dünyası</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); height: 100vh; }
        #intro { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; display: flex; justify-content: center; align-items: center; z-index: 100; transition: opacity 1s ease-out; }
        #intro h1 { font-size: 5rem; color: #ff758c; text-shadow: 2px 2px 15px rgba(255,117,140,0.4); animation: pop 1s infinite alternate; text-align: center; }
        #main { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 10; position: relative; }
        #main h1 { font-size: 6rem; background: -webkit-linear-gradient(#ff758c, #ff7eb3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1)); }
        #main p { font-size: 1.8rem; color: #555; max-width: 700px; line-height: 1.6; margin-top: 20px; font-weight: 300; z-index: 10;}
        .falling-item { position: absolute; animation: fall linear forwards; z-index: 1; opacity: 0.8; font-weight: bold; color: #ff7eb3; }
        @keyframes pop { from { transform: scale(0.95); } to { transform: scale(1.05); } }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="intro">
        <h1>MERHABA SEMANUR ✨</h1>
    </div>

    <div id="main">
        <h1>:)  SEMANUR  :)</h1>
        <p>Gökyüzünün ışığı... Etrafına en çok da bana şaşkın bakışlar atan GARİP AMA GÜZEL HANIM Bu sayfa tamamen senin için tasarlandı.</p>
    </div>

    <script>
        // Giriş ekranını gizle ve ana ekranı aç
        setTimeout(() => {
            const intro = document.getElementById('intro');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                document.getElementById('main').style.display = 'flex';
                startRain();
            }, 1000);
        }, 2500);

        // Yağmur efekti (Emoji ve İsim)
        function startRain() {
            const items = ['💖', '✨', '🥰', '🌸', '💫', '😍', 'Semanur', 'Gülücük'];
            setInterval(() => {
                const el = document.createElement('div');
                el.className = 'falling-item';
                el.innerText = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = '-50px';
                el.style.animationDuration = Math.random() * 3 + 3 + 's';
                el.style.fontSize = Math.random() * 1.5 + 1.5 + 'rem';
                document.body.appendChild(el);
                
                // Ekrandan çıkanları temizle
                setTimeout(() => el.remove(), 6000);
            }, 150);
        }
    </script>
</body>
</html>
